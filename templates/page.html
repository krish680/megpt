<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #111, #333);
            color: white;
            text-align: center;
            padding: 20px;
        }

        .card {
            max-width: 550px;
            margin: 30px auto;
            background: rgba(255,255,255,0.08);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.35);
        }

        .main-image {
            width: 100%;
            border-radius: 14px;
            margin: 18px 0;
            object-fit: cover;
        }

        .qr {
            width: 200px;
            margin-top: 20px;
            border-radius: 12px;
            background: white;
            padding: 8px;
        }

        .meta {
            opacity: 0.9;
            margin: 8px 0;
        }

        .message {
            margin-top: 18px;
            font-size: 17px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        audio {
            width: 100%;
            margin-top: 18px;
        }

        a.music-link {
            color: #ffd369;
            text-decoration: none;
            font-weight: bold;
        }

        h1, h2, h3, p {
            margin-left: 0;
            margin-right: 0;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>{{ title }}</h2>

        <p class="meta"><strong>To:</strong> {{ receiver }}</p>
        <p class="meta"><strong>From:</strong> {{ sender }}</p>

        {% if image_url %}
            <img class="main-image" src="{{ image_url }}" alt="Memory Image">
        {% endif %}

        <p class="message">{{ message }}</p>

        {% if music_url %}
            <h3>Music 🎵</h3>
            <p>
                <a class="music-link" href="{{ music_url }}" target="_blank">Open music link</a>
            </p>
        {% endif %}

        {% if qr_url %}
            <h3>QR Code</h3>
            <img class="qr" src="{{ qr_url }}" alt="QR Code">
        {% endif %}
    </div>

</body>
</html>

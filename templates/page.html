<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ title or "Our Memory" }}</title>

    {% set theme_value = (theme or 'default')|lower %}
    {% set is_audio = music_url and (
        music_url.lower().endswith('.mp3')
        or music_url.lower().endswith('.wav')
        or music_url.lower().endswith('.ogg')
        or music_url.lower().endswith('.m4a')
    ) %}

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg1: #130b16;
            --bg2: #2b1230;
            --bg3: #4a183f;
            --card: rgba(255, 255, 255, 0.10);
            --card-border: rgba(255, 255, 255, 0.14);
            --text: #ffffff;
            --muted: #f7d7e7;
            --accent: #ff7fb5;

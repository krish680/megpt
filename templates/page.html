<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }} | QR Vault</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #ffe4ec, #fff7fb);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            color: #222;
        }

        .card {
            width: 100%;
            max-width: 700px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }

        .hero img {
            width: 100%;
            display: block;
            max-height: 420px;
            object-fit: cover;
        }

        .content {
            padding: 28px;
        }

        .badge {
            display: inline-block;
            background: #ffeff5;
            color: #d63384;
            padding: 8px 14px;
            border-radius: 999px;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 32px;
            line-height: 1.2;
        }

        .meta {
            margin: 0 0 18px 0;
            color: #666;
            font-size: 16px;
        }

        .message {
            font-size: 18px;
            line-height: 1.7;
            white-space: pre-wrap;
            margin-top: 20px;
        }

        .footer {
            margin-top: 28px;
            padding-top: 18px;
            border-top: 1px solid #eee;
            font-size: 17px;
            font-weight: 600;
        }

        audio {
            width: 100%;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .content {
                padding: 20px;
            }

            h1 {
                font-size: 26px;
            }

            .message {
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        {% if image_url %}
        <div class="hero">
            <img src="{{ image_url }}" alt="Memory photo">
        </div>
        {% endif %}

        <div class="content">
            <div class="badge">{{ theme }}</div>

            <h1>{{ title }}</h1>
            <p class="meta">For <strong>{{ receiver }}</strong></p>

            <div class="message">{{ message }}</div>

            {% if music_url %}
            <audio controls>
                <source src="{{ music_url }}">
                Your browser does not support audio.
            </audio>
            {% endif %}

            <div class="footer">
                From {{ sender }} ??
            </div>
        </div>
    </div>
</body>
</html>
